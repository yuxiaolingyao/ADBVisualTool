appId: com.local.adbvisualtool
productName: ADBVisualTool
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: resources/icons
    to: icons
  - from: vendor/scrcpy
    to: scrcpy
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  shortcutName: ADB工具箱
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
